outdir: results_MOC # replace with actual name i.e. "breast_cancer_results"

scores: assets/logFC_scores_abs.tsv # replace with actual path to score file
ppi_network: assets/STRING_physical_ENSG.csv
druggability: assets/druggability_scores_annot2.0.csv
ml_scores: assets/ML_data.csv
citations: assets/PubTator3_counts.csv

hhnet_id_annot_cache: null # online realtime download mode. Annotate this line, offline mode, nextflow.config parameter is used, where hhnet_post_id_annot_cache in assets folder will be used in HHNET_POST stage
#hhnet_id_annot_cache: /scratch/users/lcao/netintegrank_update/run_netintegrank_notes/hhnet_id_annot_cache.tsv # cache loop mode, annotate above line and uncomment this line to use local cache file

gene_map: null # online realtime download mode. Annotate this line, offline mode, nextflow.config parameter is used, where gene_map_ensembl_uniprot in assets folder will be used in RANKING stage

id_annot_cache: null # Skipped when gene_map is in offline mode; used but not loop cached when gene_map in online realtime download mode
#id_annot_cache: /scratch/users/lcao/netintegrank_update/run_netintegrank_notes/ranking_id_annot_cache.tsv # Skipped when gene_map is in offline mode; used and loop cached when gene_map in online realtime download mode

hhnet_run_id: MOC_run # edit with more appropriate name i.e. breast_cancer
hhnet_num_permutations: 100
cpus: 4
hhnet_network_name: STRING
hhnet_score_name: scores # change to easy name i.e. BRCA
hhnet_compile_fortran: auto
hhnet_dir: null

hhnet_min_cluster_size: 2
hhnet_n_clusters: 0
hhnet_seed: 1234
hhnet_node_id_type: ensembl_gene_id # chnage if using different PPI with different gene ID type
hhnet_extra_colours: ""
hhnet_plot_max_nodes: 5000

ranking_network: neighbours
ranking_features: "degree,betweenness,closeness,eigen_centrality,page_rank"
negative_features: ""
ranking_step: 0.1
write_rds: true # set to false if you dont want R data objects created
